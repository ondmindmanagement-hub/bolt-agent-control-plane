# Public-source tests only. No private repositories, live providers or paid API.
name: Public Bolt offline policy tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/offline-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/offline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-policy:
    name: Node ${{ matrix.node }} / offline only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - name: Checkout public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run deterministic mocked policy tests
        env:
          CI: 'true'
        run: npm test
